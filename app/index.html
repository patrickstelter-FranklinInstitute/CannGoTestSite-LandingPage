<!doctype html>
<html lang="de" data-seite="app" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CannGo Klick-Entwurf V4</title>
<script src="../assets/messkonzept.js"></script>
<script src="../assets/track.js"></script>
<script src="../assets/consent.js"></script>
<style>
/* Farblogik V4: Grün = Aktion/Erfolg (dunkle Schrift auf hellem Grün, nie Grün auf Grün),
   Blau + ⚕ = alles Ärztliche, Orange = Achtung, Grau = Vergangenes. Kontraste ≥ 4,5:1. */
:root{
  --page:#0b1217; --phone:#141c25; --card:#1e2933; --card2:#18222b; --line:#3d4b56; --text:#eef3f6; --muted:#aab8c1;
  --act:#0f7d4c; --act-ink:#ffffff; --act-line:#3fd98f;
  --med:#7fb4ff; --med-bg:#13253f; --med-line:#4f86d9; --med-ink:#e3eeff;
  --warn:#f0a35e; --warn-bg:#3a2a18; --warn-ink:#ffe2c0;
  --past-bg:#2c3740; --past-ink:#dde4e8;
  --info-bg:#1d2b36; --info-line:#4d6475;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.5 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #f8d048;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gross{font:inherit;font-weight:700;background:#fff;color:#0b3d27;border:2px solid #fff;border-radius:999px;padding:4px 12px;cursor:pointer;min-height:32px}
.gross[aria-pressed=true]{background:#0b3d27;color:#fff}
html.gross-an main.phone{zoom:1.3}
.bar{background:var(--act);color:var(--act-ink);font-weight:bold;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wrap{max-width:1060px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px}
.layout{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:22px;align-items:start}
.phone{background:var(--phone);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 15px 45px #0007;min-width:0}
.head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px 12px;border-bottom:1px solid #2f3b45}
.head .logo{text-align:center;font-size:24px;letter-spacing:1.8px;font-weight:900;color:#d9f7b9}.logo em{font-weight:300;font-style:normal}
.back{background:none;border:0;color:var(--text);font-size:26px;line-height:1;padding:4px 8px;border-radius:8px}
.back[hidden]{display:none}
.tag{background:#22303a;padding:8px 15px;color:#dbe6ec;font-weight:bold;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.screen{padding:18px 18px 22px;min-height:470px}
.screen h1{font-size:22px;line-height:1.25;margin:4px 0 12px}
.screen p{color:#c9d4da;margin:0 0 12px}
.kicker{font-size:12px;color:#c6d9e3;letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.kicker.med{color:var(--med)}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;margin:11px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line{border-top:1px solid #34424c;margin:11px 0}
.muted{font-size:13px;color:var(--muted)}
.fine{font-size:12.5px;color:var(--muted)}
.btn{display:block;width:100%;border:0;background:var(--act);color:var(--act-ink);border-radius:10px;font-weight:800;padding:14px 12px;margin-top:11px;text-align:center;text-decoration:none}
.btn:disabled{background:#3b4a53;color:#b7c4cb;cursor:not-allowed}
.btn.sec{background:transparent;border:2px solid #8fa2ad;color:var(--text)}
.btn.med{background:#2a66c9;color:#ffffff}
.link{background:none;border:0;color:#9fd2ff;text-decoration:underline;font-weight:700;padding:4px 0}
.pill{border-radius:99px;padding:3px 10px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.new{background:var(--act);color:var(--act-ink)}
.pill.past{background:var(--past-bg);color:var(--past-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn)}
.pill.med{background:var(--med-bg);color:var(--med-ink);border:1px solid var(--med-line)}
.pill.new::before{content:"✓ "}.pill.warn::before{content:"⚠ "}
.option{width:100%;border:1px solid #51616d;border-radius:12px;background:var(--card2);color:var(--text);text-align:left;padding:13px;margin:9px 0;display:flex;gap:12px;align-items:center}
.option .txt{flex:1;min-width:0}.option strong{display:block}.option small{display:block;color:var(--muted);margin-top:3px}
.option .chk{width:24px;height:24px;border-radius:50%;border:2px solid #7d8d97;flex:none;display:grid;place-items:center;font-size:14px;font-weight:900;color:transparent}
.option.med{border-color:var(--med-line)}
.option.sel{border:2px solid var(--act-line);padding:12px}
.option.sel .chk{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.notice{border:1px solid var(--info-line);background:var(--info-bg);padding:11px 12px;border-radius:10px;margin:12px 0;font-size:14px}
.notice.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.medbox{border:1px solid var(--med-line);background:var(--med-bg);color:var(--med-ink);border-radius:12px;padding:12px;margin:11px 0}
.medlbl{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--med)}
.prod{display:flex;gap:12px;align-items:center}
.thumb{width:46px;height:48px;flex:none;background:#2b3b45;border:1px solid #4a5d69;border-radius:9px;display:grid;place-items:center;color:#d9f7b9;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px 12px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:6px}
.tile span{font-size:21px;color:#d9f7b9}.tile.med span{color:var(--med)}.tile.med{border-color:var(--med-line)}
.tabbar[hidden]{display:none}.tabbar{display:flex;border-top:1px solid #2f3b45;background:#10171e}
.tabbar button{flex:1;background:none;border:0;color:#93a5af;padding:9px 2px 11px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button span{font-size:18px}.tabbar button.on{color:#ffffff;font-weight:bold;box-shadow:inset 0 3px 0 var(--act)}
.search{display:block;width:100%;font:inherit;background:var(--card2);border:1px solid #51616d;border-radius:10px;padding:11px;color:var(--text)}.search::placeholder{color:#aab8c1}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tl{list-style:none;margin:0;padding:0}.tl li{position:relative;padding:7px 0 7px 28px;color:var(--muted)}
.tl li:before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:50%;border:2px solid #6b7c88}
.tl li.done{color:var(--text)}.tl li.done:before{background:var(--act);border-color:var(--act)}
.tl li.now{color:var(--med);font-weight:bold}.tl li.now:before{border-color:var(--med);background:var(--med-bg)}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#22c27a}
.q{margin:12px 0;border-bottom:1px solid #34424c;padding-bottom:12px}
.q>label,.q>strong{display:block;margin:0 0 7px;font-weight:700}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale label{display:flex;gap:4px;align-items:center;background:#263441;border:1px solid #4b5b66;padding:8px 11px;border-radius:8px;cursor:pointer}
.scale input{accent-color:#22c27a}
.q select,.q textarea,.q input[type=text]{width:100%;border-radius:9px;border:1px solid #617380;background:#1a2731;color:#fff;padding:10px}
.err{color:var(--warn-ink);font-size:13px;min-height:1em}
.panel{background:#17222c;border:1px solid #3c4b56;border-radius:16px;padding:18px;min-width:0}
.panel h2{margin:0 0 8px;font-size:19px}.panel p,.panel li{color:#cfd9df}
.legend{display:grid;gap:7px;margin-top:10px;font-size:14px}
.legend div{display:flex;gap:8px;align-items:center}
.sw{width:22px;height:16px;border-radius:4px;flex:none}
.dots{display:flex;gap:8px;margin:12px 0 4px}.dots span{width:11px;height:11px;border-radius:50%;background:#3d5159}.dots span.on{background:var(--act)}
textarea.json{width:100%;height:120px;font:11px/1.35 ui-monospace,Menlo,monospace;background:#101820;color:#d6e4dd;border:1px solid #445;border-radius:8px;padding:8px}
.foot{margin-top:26px;font-size:13px;color:#9fb0ba}.foot nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:6px}.foot a{color:#c6d4dc}
.sr{position:absolute;left:-9999px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{order:-1}}
.simnote{border:1px dashed var(--past,#8a9a92);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 12px;opacity:.95}
</style>
</head>
<body>
<div class="bar" role="region" aria-label="Hinweis zum Lehrprojekt"><span>CannGo · Klick-Entwurf V4</span><span>Lehrprojekt · keine offizielle CannGo-Seite · keine medizinische Beratung · fiktive Testprodukte</span><button type="button" id="gross" class="gross" aria-pressed="false">A+ Größere Schrift</button></div>
<div class="wrap">
 <div class="layout">
  <p id="ansage" class="sr" aria-live="polite"></p>
  <main class="phone" aria-label="App-Simulation">
   <div class="head"><button class="back" id="back" aria-label="Zurück" hidden>‹</button><span class="logo">CANN<em>GO</em></span><span></span></div>
   <div class="tag" id="tag"></div>
   <div class="screen" id="view"></div>
   <nav class="tabbar" id="tabbar" hidden></nav>
  </main>
  <aside class="panel" id="panel"></aside>
 </div>
 <footer class="foot"><nav><a href="../index.html">Startseite</a><a href="../impressum.html">Impressum</a><a href="../datenschutz.html">Datenschutz</a><a href="../teilnahme.html">Teilnahmehinweise</a><a href="../agb-demo.html">Demo-AGB</a><a href="#" onclick="CGConsent.open();return false">Cookie-Einstellungen</a></nav>
 Lehrprojekt im Kurs Produktmanagement, Franklin Institute, 2026. Keine medizinische Beratung.</footer>
</div>
<form name="messung" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="payload"><input name="bot-field"></form>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var qs=new URLSearchParams(location.search);
var PROD={A:{id:'A',name:'Testprodukt A',sorte:'Waldmeister',qty:'10 g',gp:'6,20 € / g',av:'verfügbar'},B:{id:'B',name:'Testprodukt B',sorte:'Lindenblüte',qty:'5 g',gp:'6,75 € / g',av:'verfügbar'},C:{id:'C',name:'Testprodukt C',sorte:'Bergamotte',qty:'5 g',gp:'7,50 € / g',av:'wenig Bestand'},D:{id:'D',name:'Testprodukt D',sorte:'Salbei',qty:'10 g',gp:'5,90 € / g',av:'verfügbar'},E:{id:'E',name:'Testprodukt E',sorte:'Zeder',qty:'5 g',gp:'8,10 € / g',av:'verfügbar'},F:{id:'F',name:'Testprodukt F',sorte:'Holunder',qty:'15 g',gp:'5,40 € / g',av:'wenig Bestand'}};
var PROD_IDS=['C','E','A','F','B','D']; // bewusst gemischt: B steht nicht oben
var FEE='14,99 €';
var st={screen:'start',tourAt:0,phase:'tour',variante:(qs.get('v')||'').toLowerCase(),reihenfolge:qs.get('o')||'',code:CG.S.code,
  cart:null,pick:null,health:null,firstHealth:null,request:null,agb:false,zurueck:0,aendern:0,t0:null,err:'',hist:[],agbOpen:false,survey:null};

/* ---------- Hilfen ---------- */
var prod=function(p){return '<div class="prod"><div class="thumb">▤</div><div><strong>'+esc(p.name)+'</strong><div class="muted">'+(p.sorte?'Sorte '+esc(p.sorte)+' · ':'')+p.qty+' · '+p.gp+'</div></div></div>'};
var med=function(t){return '<span class="medlbl">⚕ '+(t||'Ärztlich')+'</span>'};
function go(screen,opts){opts=opts||{};if(!opts.noHist&&st.screen!==screen)st.hist.push(st.screen);st.screen=screen;st.err='';CG.setScreen(screen);window.scrollTo(0,0);render();sagAn()}
function sagAn(){try{var m=document.querySelector('main.phone');var h=m&&m.querySelector('h1,h2,h3');var a=document.getElementById('ansage');if(a)a.textContent=h?('Neuer Bildschirm: '+h.textContent.trim()):'';if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}catch(_){}}
function back(){if(!st.hist.length)return;st.zurueck++;CG.track('zurueck_klick',{von:st.screen});var prev=st.hist.pop();st.screen=prev;CG.setScreen(prev);render();sagAn()}
var ist=function(){return st.variante==='ist'};

/* ---------- Tour: App kennenlernen ---------- */
var TOUR=[
 {k:'Start',t:'Hallo! Was möchtest du heute erledigen?',tab:'start',body:function(){return tiles(false)},
  what:'CannGo bündelt drei Schritte: <b>Produkt aussuchen</b>, <b>ärztliche Prüfung online anfragen</b> und das Produkt über eine <b>Partner-Apotheke</b> bekommen.',day:'„Mein Rezept läuft bald aus. Ich will ohne Wartezimmer eine neue Anfrage stellen.“'},
 {k:'Produkte',t:'Produkte entdecken',tab:'produkte',body:function(){return productList(false)},
  what:'Suchen, filtern, <b>Preis pro Gramm</b> vergleichen und sehen, was <b>verfügbar</b> ist.',day:'„Ich will eine andere Sorte probieren und vorher wissen, was sie kostet.“'},
 {k:'Apotheke',t:'Apotheke wählen',tab:'produkte',body:function(){return [['Grüne Apotheke','beide Produkte vorrätig · Lieferung','passt','new'],['Stadt-Apotheke','1 von 2 vorrätig','teilweise','warn'],['Apotheke am Markt','Abholung möglich','passt','new']].map(function(a){return '<div class="card"><div class="row"><strong>'+a[0]+'</strong><span class="pill '+a[3]+'">'+a[2]+'</span></div><div class="muted" style="margin-top:6px">'+a[1]+'</div></div>'}).join('')},
  what:'Die Apotheke bestimmt, was <b>gemeinsam verfügbar</b> ist und ob geliefert oder abgeholt wird.',day:'„Ich will alles bei einer Apotheke bekommen.“'},
 {k:'Warenkorb',t:'Warenkorb / Rezeptwunsch',tab:'warenkorb',body:function(){return '<div class="card"><div class="row"><b>Ausgewählt</b><span class="pill new">Neu</span></div><div class="line"></div>'+prod(PROD.B)+'</div><p class="fine">Der Warenkorb ist ein Wunsch. Ob und was verschrieben wird, entscheidet die Ärztin oder der Arzt.</p>'},
  what:'Der Warenkorb ist dein <b>Rezeptwunsch</b>: Das möchtest du gern bekommen.',day:'„Diesmal soll es ein anderes Produkt sein.“'},
 {k:'Ärztliche Prüfung',t:'Rezept anfragen',tab:'warenkorb',med:true,body:function(){return '<div class="medbox">'+med()+'<div style="margin-top:6px">Alles mit diesem Zeichen hat mit der <b>ärztlichen Prüfung</b> zu tun.</div></div>'+[['⚕ Online-Anfrage','Fragebogen, Prüfung online',FEE],['⚕ Videosprechstunde','Gespräch per Video','je nach Praxis'],['⚕ Termin vor Ort','in einer Partnerpraxis','je nach Praxis']].map(function(o){return '<div class="option med"><span class="chk">✓</span><span class="txt"><strong>'+o[0]+'</strong><small>'+o[1]+'</small></span><span class="pill med">'+o[2]+'</span></div>'}).join('')},
  what:'Hier wählst du, <b>wie</b> du ärztlich geprüft werden willst. In dieser Demo ist alles Ärztliche <b style="color:var(--med)">blau</b> markiert.',day:'„Ich will schnell eine Folgeanfrage stellen.“'},
 {k:'Anfragen',t:'Meine Anfragen',tab:'status',body:function(){return statusCard('Anfrage vom 04.11.')},
  what:'Der Status zeigt Schritt für Schritt, <b>wo deine Anfrage steht</b> und wer als Nächstes dran ist.',day:'„Ist mein Rezept schon durch?“'},
 {k:'Hilfe',t:'Hilfe & Chat',tab:'hilfe',body:function(){return ['Was kostet eine Anfrage?','Wie lange dauert die ärztliche Prüfung?','Kann ich mein Produkt nachträglich ändern?'].map(function(q){return '<div class="card row">'+q+'<span>›</span></div>'}).join('')},
  what:'Antworten auf häufige Fragen und ein Chat, wenn du nicht weiterkommst.',day:'„Ich habe mich vertan und will mein Produkt ändern.“'}
];
function tiles(active){var t=[['produkte','⌕','Produkte finden',0],['apotheke','✚','Apotheke wählen',0],['warenkorb','▤','Mein Warenkorb',0],['anfrage','⚕','Rezept anfragen',1],['status','◷','Meine Anfragen',0],['hilfe','?','Hilfe & Chat',0]];
 return '<div class="tiles">'+t.map(function(x){return '<button class="tile'+(x[3]?' med':'')+'" '+(active?'data-act="tile-'+x[0]+'"':'data-tour="'+x[0]+'"')+'><span aria-hidden="true">'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</div>'+
 '<div class="card"><div class="row"><b>Deine letzte Anfrage</b><span class="pill past">abgeschlossen</span></div><div class="muted" style="margin-top:6px">Testprodukt A · 10 g</div></div>'}
function productCards(active){var q=(st.q||'').trim().toLowerCase();var ids=PROD_IDS.filter(function(id){var p=PROD[id];return !q||(p.name+' '+p.sorte+' '+id).toLowerCase().indexOf(q)>=0});
 if(!ids.length)return '<p class="muted">Kein Produkt gefunden. Versuch es mit einem anderen Begriff.</p>';
 return ids.map(function(id){var p=PROD[id];var inCart=st.cart===id;
 return '<div class="card"><div class="row">'+prod(p)+'<span class="pill '+(p.av==='verfügbar'?'new':'warn')+'">'+p.av+'</span></div>'+(id==='A'?'<div style="margin-top:8px"><span class="pill past">↺ Letztes Mal bestellt</span></div>':'')+(active?'<button class="btn '+(inCart?'sec':'')+'" data-act="add-'+id+'">'+(inCart?'Im Warenkorb ✓':'In den Warenkorb')+'</button>':'')+'</div>'}).join('')}
function productList(active){return (active?'<label class="sr" for="prodq">Produkt oder Sorte suchen</label><input id="prodq" class="search" type="search" placeholder="⌕ Produkt oder Sorte suchen" autocomplete="off" value="'+esc(st.q||'')+'">':'<div class="search">⌕ Produkt oder Sorte suchen</div>')+'<div id="plist">'+productCards(active)+'</div>'}
function statusCard(t){return '<div class="card"><div class="row"><b>'+t+'</b><span class="pill med">⚕ in Prüfung</span></div><div class="line"></div><ol class="tl"><li class="done">Anfrage gesendet</li><li class="now">Ärztliche Prüfung</li><li>Rezept ausgestellt</li><li>Apotheke bereitet vor</li><li>Versand oder Abholung</li></ol></div>'}

/* ---------- Bildschirme ---------- */
var scenario='<p><b>Deine Situation:</b> Du hast über CannGo schon einmal <b>Testprodukt A</b> bekommen. Gesundheitlich ist alles <b>wie vorher</b>. Diesmal möchtest du <b>Testprodukt B</b> ausprobieren.</p><p><b>Deine Aufgabe:</b> Such Produkt B, leg es in den Warenkorb und schick die Anfrage ab, so wie du es in echt tun würdest. Denk gern laut.</p>';
function view(){var s=st.screen;
 if(s==='start')return '<div class="kicker">Willkommen</div><h1>Lern die App in 7 kurzen Schritten kennen</h1><p>Danach testest du eine Folgeanfrage. Alles ist eine Simulation mit fiktiven Produkten.</p>'+tiles(false)+'<button class="btn" data-act="tour-start">Tour starten</button><button class="btn sec" data-act="tour-skip">Tour überspringen, direkt zum Test</button>';
 if(s==='tour'){var T=TOUR[st.tourAt];return '<div class="kicker'+(T.med?' med':'')+'">'+(T.med?'⚕ ':'')+T.k+' · '+(st.tourAt+1)+' von '+TOUR.length+'</div><h1>'+T.t+'</h1>'+T.body()}
 if(s==='anmeldung')return '<div class="kicker">Test · Anmeldung</div><h1>Bevor es losgeht</h1>'+
  '<div class="q"><label for="code">Dein Testcode, z. B. T21</label><input type="text" id="code" maxlength="16" value="'+esc(st.code)+'" autocomplete="off"></div>'+
  '<div class="q"><label for="var">Welche Variante sollst du testen?</label><select id="var"><option value="">Bitte wählen</option><option value="ist"'+(st.variante==='ist'?' selected':'')+'>IST (bisheriger Ablauf)</option><option value="soll"'+(st.variante==='soll'?' selected':'')+'>SOLL (neuer Ablauf)</option></select></div>'+
  '<div class="q"><label for="ord">Dein wievielter Test heute?</label><select id="ord"><option value="">Bitte wählen</option><option value="erster"'+(st.reihenfolge==='erster'?' selected':'')+'>erster</option><option value="zweiter"'+(st.reihenfolge==='zweiter'?' selected':'')+'>zweiter</option><option value="nur_einer"'+(st.reihenfolge==='nur_einer'?' selected':'')+'>ich mache nur einen</option></select></div>'+
  '<div class="check"><input type="checkbox" id="ok"><label for="ok">Ich bin mindestens 18, mache freiwillig mit und habe die <a href="../teilnahme.html" style="color:#9fd2ff">Teilnahmehinweise</a> gelesen. Ich gebe keine echten Gesundheitsdaten ein.</label></div>'+
  '<div class="err">'+esc(st.err)+'</div><button class="btn" data-act="anmelden">Weiter zur Aufgabe</button>';

  CG.track('bewertung_gesendet',{r1:r[0],r2:r[1],r3:r[2],durchschnitt:+((r[0]+r[1]+r[2])/3).toFixed(2),geglaubt:g,sicherheit:+cf,richtig_erkannt:g===st.request,nps:np,variante:st.variante,kommentar:st.survey.kommentar});
  go('ende',{noHist:true});CG.flush();return}
 if(id==='copy'){var t=$('json').value,o2=$('copied');try{navigator.clipboard.writeText(t).then(function(){o2.textContent='Kopiert.'},function(){$('json').select();o2.textContent='Text ist markiert: Strg/Cmd + C.'})}catch(e){$('json').select();o2.textContent='Text ist markiert: Strg/Cmd + C.'}return}
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act],[data-tour],button,a');if(!b)return;
 if(b.closest('.phone')||b.closest('.panel')){var lbl=(b.innerText||b.getAttribute('aria-label')||'').trim().replace(/\s+/g,' ').slice(0,60);if(lbl)CG.track('klick',{label:lbl})}
 if(b.id==='back'){back();return}
 if(b.dataset.tour)return; // Kacheln in der Tour sind nur Anschauung
 var id=b.dataset.act;if(!id)return;
 if(id==='agb-open'){CG.track('agb_geoeffnet');return} // Link öffnet die Demo-AGB im selben Tab
 e.preventDefault();act(id,b);
});
CG.track('app_aufruf',{quelle:CG.S.quelle});
if(qs.get('v')&&CG.S.code&&qs.get('o')){st.screen='anmeldung'}
CG.setScreen(st.screen);render();
})();
</script>

(function(){var b=document.getElementById('gross');if(!b)return;
 function set(on,track){document.documentElement.classList.toggle('gross-an',on);b.setAttribute('aria-pressed',on?'true':'false');b.textContent=on?'A− Normale Schrift':'A+ Größere Schrift';
  try{sessionStorage.setItem('cg_gross',on?'1':'0')}catch(_){}
  if(track&&window.CG)CG.track('app_einstellung',{wert:on?'grosse_schrift_an':'grosse_schrift_aus'});}
 var on=false;try{on=sessionStorage.getItem('cg_gross')==='1'}catch(_){}
 set(on,false);b.addEventListener('click',function(){set(b.getAttribute('aria-pressed')!=='true',true)});})();
